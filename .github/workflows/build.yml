name: Build NexFlash

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK & CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build libusb_bridge (all ABIs)
        run: |
          set -euo pipefail
          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          for ABI in arm64-v8a armeabi-v7a x86 x86_64; do
            BUILD="native/build/libusb_bridge-$ABI"
            cmake -S native/libusb_bridge -B "$BUILD" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-24 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=MinSizeRel
            cmake --build "$BUILD" -j"$(nproc)"
            cp "$BUILD/libusb_bridge.so" "app/src/main/jniLibs/$ABI/libusb_bridge.so"
            llvm-strip --strip-unneeded "app/src/main/jniLibs/$ABI/libusb_bridge.so" || "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded "app/src/main/jniLibs/$ABI/libusb_bridge.so"
            echo "=== $ABI ==="
            ls -lh "app/src/main/jniLibs/$ABI/libusb_bridge.so"
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -Ws "app/src/main/jniLibs/$ABI/libusb_bridge.so" | grep get_devices || true
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nexun.jks"
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build release APK
        run: gradle --no-daemon clean :app:assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/nexun.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexFlash-release
          path: app/build/outputs/apk/release/*.apk
